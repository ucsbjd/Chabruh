# Deploys the game to Firebase Hosting (project chabruh-surf) on every push to main.
# Needs one repo secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a service
# account in that project (Firebase console > Project settings > Service accounts).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until the Firebase key is added
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chabruh-surf
          channelId: live
