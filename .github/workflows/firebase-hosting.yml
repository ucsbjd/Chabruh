# Deploys the game to Firebase Hosting on every push to main.
# Needs, in the repo's Settings > Secrets and variables > Actions:
#   secret   FIREBASE_SERVICE_ACCOUNT  (JSON key of a service account with Firebase Hosting Admin)
#   variable FIREBASE_PROJECT_ID       (the Firebase project id)
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
